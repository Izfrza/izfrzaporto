<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            padding: 20px;
            overflow: hidden;
        }

        h1 {
            color: #fff;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 24px;
            text-align: center;
        }

        #scene {
            background: #000;
            width: 100%;
            max-width: 560px;
            aspect-ratio: 2.8 / 1;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #deadline-label {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(10px, 3vw, 13px);
            white-space: nowrap;
            pointer-events: none;
        }

        #deadline-label .dead {
            color: #e8002d;
        }

        #deadline-label .line {
            color: #fff;
        }

        #dead-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        #dead-overlay.show {
            opacity: 1;
        }

        #dead-overlay p {
            color: #e8002d;
            font-size: clamp(18px, 6vw, 24px);
            font-weight: bold;
            letter-spacing: 3px;
        }

        #dead-overlay small {
            color: #888;
            font-size: clamp(11px, 3.5vw, 13px);
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <h1>Deadline Loading</h1>

    <div id="scene">
        <canvas id="c"></canvas>
        <div id="deadline-label">
            <span class="dead">Dead</span><span class="line">line <span id="num">0</span></span>
        </div>
        <div id="dead-overlay">
            <p>DEADLINE!</p>
            <small>commit dulu baru mati 💀</small>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const numEl = document.getElementById('num');
        const overlay = document.getElementById('dead-overlay');

        // Resolusi internal canvas (tetap konstan untuk kalkulasi koordinat draw)
        const W = 560, H = 200;
        const BAR_X = 40, BAR_Y = 138, BAR_W = 480, BAR_H = 14;
        const FLOOR_Y = 138;

        let progress = 0;
        let raf = null;
        let step = 0;
        let done = false;
        const speed = 2; // Kecepatan default dikunci internal

        // Fungsi Penanganan Responsif
        function resizeCanvas() {
            canvas.width = W;
            canvas.height = H;
            render();
        }
        window.addEventListener('resize', resizeCanvas);

        // ─── DRAW DETAIL GRIM REAPER (SANGAR & SUPER LANCIP) ─────────────────────
        function drawReaper(x, y, bounce) {
            ctx.save();
            ctx.translate(x, y + bounce);

            const R = '#e8002d';
            const DR = '#5e000e';
            const SHADOW = '#2a0005';

            // 1. EFEK BAYANGAN UBUL-UBUL JUBAH (Belakang)
            ctx.fillStyle = SHADOW;
            ctx.beginPath();
            ctx.moveTo(-18, -45);
            ctx.lineTo(-35, -20);
            ctx.lineTo(-40, 10);
            ctx.lineTo(-20, 20);
            ctx.lineTo(5, 10);
            ctx.closePath();
            ctx.fill();

            // 2. JUBAH BELAKANG SOBEK-SOBEK
            ctx.fillStyle = DR;
            ctx.beginPath();
            ctx.moveTo(-15, -45);
            ctx.quadraticCurveTo(-35, -25, -30, 0);
            ctx.lineTo(-35, 8); ctx.lineTo(-25, 4); ctx.lineTo(-28, 18);
            ctx.lineTo(-15, 10); ctx.lineTo(-10, 19); ctx.lineTo(0, 12);
            ctx.lineTo(8, 18); ctx.lineTo(14, 0);
            ctx.closePath();
            ctx.fill();

            // 3. JUBAH UTAMA (Maju Membungkuk)
            ctx.fillStyle = R;
            ctx.beginPath();
            ctx.moveTo(-15, -45);
            ctx.quadraticCurveTo(5, -55, 16, -45);
            ctx.quadraticCurveTo(25, -25, 22, -15);
            ctx.lineTo(18, 18);
            ctx.lineTo(6, 12);
            ctx.lineTo(-6, 18);
            ctx.lineTo(-20, 14);
            ctx.closePath();
            ctx.fill();

            // 4. HOOD / KERUDUNG KEPALA MISTERIUS
            ctx.fillStyle = R;
            ctx.beginPath();
            ctx.moveTo(-16, -45);
            ctx.quadraticCurveTo(-26, -68, -3, -76);
            ctx.quadraticCurveTo(18, -72, 20, -46);
            ctx.lineTo(10, -42);
            ctx.quadraticCurveTo(6, -62, -8, -52);
            ctx.closePath();
            ctx.fill();

            // Rongga Muka Hitam Pekat
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.moveTo(3, -64);
            ctx.quadraticCurveTo(15, -60, 15, -47);
            ctx.quadraticCurveTo(7, -38, -1, -44);
            ctx.quadraticCurveTo(1, -56, 3, -64);
            ctx.fill();

            // 5. MATA ANGRY GLOWING RED
            ctx.shadowBlur = 10;
            ctx.shadowColor = R;
            ctx.fillStyle = R;
            ctx.beginPath();
            ctx.moveTo(4, -53); ctx.lineTo(9, -51); ctx.lineTo(5, -49); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(10, -52); ctx.lineTo(14, -50); ctx.lineTo(11, -48); ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0;

            // 6. GAGANG ARIT MAUT (Melengkung & Runcing Atas-Bawah)
            ctx.strokeStyle = '#380108';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(6, 24);
            ctx.quadraticCurveTo(18, -30, 24, -40);
            ctx.quadraticCurveTo(34, -78, 38, -102); // Sangat menjulang tinggi ke atas
            ctx.stroke();

            // Tangan Jubah
            ctx.fillStyle = R;
            ctx.beginPath();
            ctx.ellipse(23, -38, 5, 4, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // 7. MATA PISAU ARIT EKSTREM LANCIP (Bentuk Celurit Khas)
            ctx.fillStyle = R;
            ctx.beginPath();
            ctx.moveTo(38, -102); // Berawal dari pucuk gagang tertinggi

            // Lekukan punggung luar melengkung lebar ke kanan bawah (Sangat Tajam)
            ctx.bezierCurveTo(85, -118, 105, -65, 82, -24);

            // Ujung mata arit membentuk sudut tajam menyengat (Lancip Sempurna)
            ctx.quadraticCurveTo(92, -55, 34, -90);
            ctx.closePath();
            ctx.fill();

            // Efek Sisi Tajam / Kilatan Bilah Arit
            ctx.strokeStyle = '#ff7388';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(40, -99);
            ctx.bezierCurveTo(78, -112, 98, -64, 81, -26);
            ctx.stroke();

            // Ornamen Duri-Duri Gerigi Tambahan di Punggung Sabit
            ctx.fillStyle = DR;
            ctx.beginPath();
            ctx.moveTo(46, -104); ctx.lineTo(54, -112); ctx.lineTo(54, -102); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(58, -98); ctx.lineTo(66, -105); ctx.lineTo(65, -96); ctx.closePath(); ctx.fill();

            ctx.restore();
        }

        // ─── DRAW STICKMAN CODER ─────────────────────────────────────────────────
        function drawCoder(x, y, typeBounce) {
            ctx.save();
            ctx.translate(x, y);

            const W2 = '#ffffff';

            // Monitor
            ctx.fillStyle = '#333';
            ctx.fillRect(-30, -68, 36, 26);
            ctx.strokeStyle = W2;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-30, -68, 36, 26);

            // Screen Glow
            ctx.strokeStyle = '#e8002d';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-26, -62); ctx.lineTo(-4, -62); ctx.stroke();
            ctx.strokeStyle = '#555';
            ctx.beginPath(); ctx.moveTo(-26, -57); ctx.lineTo(-10, -57); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-26, -52); ctx.lineTo(-16, -52); ctx.stroke();

            // Stand
            ctx.strokeStyle = W2;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-12, -42); ctx.lineTo(-12, -36); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-20, -36); ctx.lineTo(-4, -36); ctx.stroke();

            // Desk
            ctx.fillStyle = '#444';
            ctx.fillRect(-34, -36, 52, 5);

            // Torso
            ctx.strokeStyle = W2;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(0, -8); ctx.stroke();

            // Head
            ctx.beginPath(); ctx.arc(0, -36, 8, 0, Math.PI * 2); ctx.stroke();

            // Arms (Ketik)
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-18, -14 + typeBounce); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(14, -12 + typeBounce); ctx.stroke();

            // Keyboard
            ctx.fillStyle = '#555';
            ctx.fillRect(-20, -33, 34, 6);

            // Legs & Chair
            ctx.strokeStyle = W2; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(14, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(14, -4); ctx.lineTo(14, 16); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(-12, -2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-12, -2); ctx.lineTo(-12, 16); ctx.stroke();

            ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-18, 16); ctx.lineTo(20, 16); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-16, 16); ctx.lineTo(-16, 28); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(18, 16); ctx.lineTo(18, 28); ctx.stroke();

            ctx.restore();
        }

        // ─── DRAW PROGRESS BAR ───────────────────────────────────────────────────
        function drawBar(pct) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(BAR_X, BAR_Y, BAR_W, BAR_H, 7);
            ctx.fill();

            if (pct > 0) {
                const fw = (pct / 100) * BAR_W;
                ctx.fillStyle = '#e8002d';
                ctx.beginPath();
                ctx.roundRect(BAR_X, BAR_Y, fw, BAR_H, 7);
                ctx.fill();
            }
        }

        // ─── MAIN RENDER & ANIMATION ─────────────────────────────────────────────
        function render() {
            ctx.clearRect(0, 0, W, H);

            const reaperX = BAR_X + (progress / 100) * BAR_W - 14;
            const bounce = Math.sin(step * 0.22) * 4;
            const typeBounce = Math.sin(step * 0.6) * 2;

            drawBar(progress);

            const coderX = BAR_X + BAR_W + 18;
            const coderY = FLOOR_Y - 20;
            drawCoder(coderX, coderY, typeBounce);

            drawReaper(reaperX, FLOOR_Y - 20, bounce);

            numEl.textContent = Math.round(progress);
        }

        function animate() {
            if (done) return;
            step++;
            progress += speed * 0.12;

            if (progress >= 100) {
                progress = 100;
                render();
                numEl.textContent = '100';
                done = true;
                setTimeout(() => { overlay.classList.add('show'); }, 400);
                return;
            }

            render();
            raf = requestAnimationFrame(animate);
        }

        // Jalankan Inisialisasi Pertama
        resizeCanvas();
        animate();
    </script>
</body>

</html>
